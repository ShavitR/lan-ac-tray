name: Bug report
description: Report a reproducible problem with LAN AC Tray.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include local IP addresses, MAC addresses, Wi-Fi names, device IDs, packet captures, or the contents of your local settings file.
  - type: input
    id: app_version
    attributes:
      label: App version or commit
      description: For a source checkout, include the commit shown by `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: input
    id: windows_version
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: powershell_version
    attributes:
      label: PowerShell version
      placeholder: 7.6.5
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device family and model
      description: Share only details you are comfortable making public. Do not include its MAC or IP address.
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: Include the menu or Settings action that led to the problem.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked this report for local IP addresses, MAC addresses, Wi-Fi names, device IDs, and private data.
          required: true
